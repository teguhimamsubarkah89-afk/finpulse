<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1326" />
  <meta name="description" content="FinPulse — Kelola keuangan pribadimu dengan cerdas. Catat transaksi, atur anggaran, dan raih target finansialmu." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>FinPulse — Keuangan Pribadi</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
</head>

<body>
  <!-- App Mount Point -->
  <div id="app" style="opacity:0;transition:opacity 0.2s ease-out,transform 0.2s ease-out;">
    <!-- Loading skeleton while JS loads -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
      <div style="font-family:'Inter',sans-serif;font-size:36px;font-weight:800;color:#d0bcff;letter-spacing:-0.04em;">
        FinPulse
      </div>
      <div style="width:48px;height:48px;border:3px solid rgba(208,188,255,0.2);border-top-color:#d0bcff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    </div>
  </div>

  <!-- Core JS (order matters: dependencies first) -->
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/components.js"></script>

  <!-- Pages -->
  <script src="pages/splash.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/dashboard.js"></script>
  <script src="pages/transactions.js"></script>
  <script src="pages/add-transaction.js"></script>
  <script src="pages/budgets.js"></script>
  <script src="pages/reports.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/profile.js"></script>

  <!-- App Router (must be last) -->
  <script src="js/app.js"></script>
</body>

</html>
