<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - FinPulse</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#cbc3d7",
                        "secondary": "#4edea3",
                        "on-tertiary-container": "#4e3e00",
                        "on-primary-fixed": "#23005c",
                        "surface-tint": "#d0bcff",
                        "tertiary": "#eec200",
                        "outline": "#958ea0",
                        "primary-fixed-dim": "#d0bcff",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#3c0091",
                        "on-background": "#dae2fd",
                        "tertiary-container": "#cea700",
                        "on-secondary-container": "#00311f",
                        "on-secondary-fixed-variant": "#005236",
                        "outline-variant": "#494454",
                        "primary": "#d0bcff",
                        "on-tertiary": "#3c2f00",
                        "surface-container": "#171f33",
                        "inverse-surface": "#dae2fd",
                        "on-primary-container": "#340080",
                        "tertiary-fixed-dim": "#eec200",
                        "on-secondary": "#003824",
                        "surface-container-lowest": "#060e20",
                        "on-primary-fixed-variant": "#5516be",
                        "secondary-container": "#00a572",
                        "surface-container-highest": "#2d3449",
                        "surface-container-high": "#222a3d",
                        "inverse-on-surface": "#283044",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#231b00",
                        "tertiary-fixed": "#ffe083",
                        "on-tertiary-fixed-variant": "#574500",
                        "primary-fixed": "#e9ddff",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-container": "#a078ff",
                        "surface-container-low": "#131b2e",
                        "error-container": "#93000a",
                        "surface-bright": "#31394d",
                        "background": "#0b1326",
                        "on-error": "#690005",
                        "surface-dim": "#0b1326",
                        "secondary-fixed": "#6ffbbe",
                        "surface": "#0b1326",
                        "surface-variant": "#2d3449",
                        "inverse-primary": "#6d3bd7",
                        "on-secondary-fixed": "#002113"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "base": "8px",
                        "section-gap": "40px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "watermark": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "42px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "watermark": ["10px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-container-margin">
    <!-- Ambient Background Effect -->
    <div
        class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-container via-background to-background">
    </div>
    <!-- Main Content Canvas -->
    <main class="w-full max-w-md z-10 flex flex-col items-center space-y-section-gap relative">
        <!-- Brand / Header -->
        <div class="text-center space-y-base w-full">
            <h1
                class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter">
                FinPulse</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Empower Your Finances.</p>
        </div>
        <!-- Login Card / Actions -->
        <div
            class="w-full bg-surface-container/50 backdrop-blur-xl rounded-xl p-8 flex flex-col gap-6 shadow-2xl border border-outline-variant/10">
            <button
                class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-caps text-label-caps flex items-center justify-center gap-3 hover:bg-primary-fixed transition-colors active:scale-95 duration-200">
                <svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4"></path>
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853"></path>
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05"></path>
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335"></path>
                </svg>
                <span>Continue with Google</span>
            </button>
            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-outline-variant/30"></div>
                <span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-outline">or</span>
                <div class="flex-grow border-t border-outline-variant/30"></div>
            </div>
            <button
                class="w-full h-14 bg-surface-container-high text-on-surface rounded-xl font-label-caps text-label-caps flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors active:scale-95 duration-200 border border-outline-variant/30">
                <span class="material-symbols-outlined" data-icon="mail">mail</span>
                <span>Other login methods</span>
            </button>
        </div>
    </main>
    <!-- Footer Watermark -->
    <footer class="absolute bottom-0 w-full flex justify-center items-center py-8 opacity-50 bg-transparent z-0">
        <p class="font-watermark text-watermark text-outline">Didesain oleh Teguh Imam Subarkah</p>
    </footer>
</body>

</html>
